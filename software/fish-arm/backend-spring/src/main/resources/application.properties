server.port=8090
spring.application.name=aquagarden-server

spring.datasource.url=jdbc:sqlite:aquagarden.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

aquagarden.jwt.secret=your-secret-key-change-in-production-min-256-bits-please-use-long-secret
aquagarden.jwt.expiration-minutes=30

# 可选下游硬件 HTTP 端点。机械臂/滑轨若仍由专用设备提供，可继续代理；
# 传感器、鱼缸视频和水泵已可由 Spring Boot 直接通过串口实现。
aquagarden.bridge.base-url=http://10.126.83.50:18080
aquagarden.bridge.paths.status=/api/status
aquagarden.bridge.paths.task=/api/task/{task}
aquagarden.bridge.paths.arm-home=/api/arm/home
aquagarden.bridge.paths.arm-pose=/api/arm/pose
aquagarden.bridge.paths.arm-gripper=/api/arm/gripper
aquagarden.bridge.paths.rail-position=/api/rail/position
aquagarden.bridge.paths.pump-pulse=/api/pump/pulse
aquagarden.bridge.paths.pump-start=/api/pump/start
aquagarden.bridge.paths.pump-pwm=/api/pump/pwm
aquagarden.bridge.paths.pump-auto=/api/pump/auto
aquagarden.bridge.paths.pump-stop=/api/pump/stop
aquagarden.bridge.paths.pump-manual=/api/pump/manual
aquagarden.bridge.paths.video-rgb=/video/rgb.mjpg
aquagarden.bridge.paths.video-depth=/video/depth.mjpg
# 下游 Bridge 若启用了鉴权，在这里配置要转发的固定认证头。
# 示例：
# aquagarden.bridge.auth.header-name=Authorization
# aquagarden.bridge.auth.header-value=Bearer ${AQUA_BRIDGE_TOKEN:}
aquagarden.bridge.auth.header-name=
aquagarden.bridge.auth.header-value=

# MJPEG /api/aqua/video/* 使用 StreamingResponseBody（异步请求），默认 30s 会触发 AsyncRequestTimeoutException
spring.mvc.async.request-timeout=-1

spring.jackson.serialization.write-dates-as-timestamps=false

# Sensor history: auto-delete rows older than N days (30d chart needs retention >= 30)
aquagarden.sensor-readings-retention-days=30
# Detailed records keep at most 100 pages * 20 rows/page = 2000 latest rows
aquagarden.sensor-readings-max-pages=100
aquagarden.sensor-readings-page-size=20
# Spring cron: sec min hour day month weekday — daily 03:15
aquagarden.sensor-readings-purge-cron=0 15 3 * * *

# 设备上报令牌（当前写死用于联调）
aquagarden.device-upload.token=123456789
# Dashboard 最新值只在该时间窗口内认为是实时硬件数据；超时后返回稳定模拟值
aquagarden.sensors.realtime-max-age-ms=10000

# 后端直连硬件（不再依赖 Python Bridge）。启用后 Spring Boot 直接打开 MCU 串口：
#  - 解析 0x55 0xAA 二进制传感器帧并写入 /api/sensors 使用的缓存与历史库
#  - 提取串口 JPEG 帧并写入 /api/video/tank
#  - 通过同一串口发送 PUMP START/PWM/STOP/AUTO/MANUAL 命令
aquagarden.hardware.serial.enabled=true
aquagarden.hardware.serial.port=COM20
aquagarden.hardware.serial.baud=115200
aquagarden.hardware.serial.max-jpeg-bytes=524288
aquagarden.hardware.serial.persist-interval-ms=1000
aquagarden.hardware.serial.reconnect-delay-ms=3000

# 水泵与传感器共用 COM3 / USB-Serial。默认由 Spring Boot 的 HardwareSerialService 直接控制。
# 仅在不启用 aquagarden.hardware.serial.enabled 且需要兼容 serial_bridge.py 水泵 HTTP 时改为 true。
aquagarden.serial-pump.enabled=false
aquagarden.serial-pump.base-url=http://127.0.0.1:18080

# RGB/Depth 摄像头如果本身提供 HTTP/MJPEG/JPEG 地址，可由 Spring Boot 直接代理。
# 留空时 /api/aqua/video/{mode} 返回后端生成的等待画面，不再强依赖 Python Bridge。
aquagarden.hardware.camera.rgb-url=
aquagarden.hardware.camera.depth-url=

# LLM（未配置密钥或调用失败时使用规则引擎回退）。请勿将密钥提交到 Git。
# 默认按 Anthropic Messages 兼容接口调用 Kimi，可通过环境变量覆盖：
#   ANTHROPIC_BASE_URL=https://api.kimi.com/coding/
#   ANTHROPIC_AUTH_TOKEN=<your token>
#   ANTHROPIC_MODEL=kimi-for-coding
aquagarden.llm.provider=anthropic
aquagarden.llm.enabled=true
aquagarden.llm.base-url=${ANTHROPIC_BASE_URL:https://api.kimi.com/coding}
aquagarden.llm.api-key=${ANTHROPIC_AUTH_TOKEN:${ANTHROPIC_API_KEY:sk-kimi-22IUUa8A3Sg2fOVFTafPjILzWK1O2W2Wmw7Q5RGteAgX889KydOG1IhPcNRFfbTt}}
aquagarden.llm.model=${ANTHROPIC_MODEL:${ANTHROPIC_DEFAULT_SONNET_MODEL:kimi-for-coding}}
aquagarden.llm.max-tokens=768
aquagarden.llm.anthropic-version=2023-06-01

# OpenAI 兼容示例（切回时请改为 provider=openai 且填写 OPENAI_API_KEY）
# aquagarden.llm.provider=openai
# aquagarden.llm.base-url=https://api.openai.com/v1
# aquagarden.llm.api-key=${OPENAI_API_KEY:}
# aquagarden.llm.model=gpt-4o-mini
