<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - AquaGarden</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #080c18 0%, #0b1428 100%);
            color: #d0dff5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #0b1228;
            border: 1px solid #1b3060;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 40px rgba(0, 100, 200, 0.15);
        }
        .logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #00c8ff, #005fff);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            margin: 0 auto 24px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00c8ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #3a5a8a;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #5a8ac0;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #142040;
            border: 1px solid #1e3a60;
            border-radius: 10px;
            color: #c0d8f0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #00c8ff;
        }
        input::placeholder {
            color: #3a5a80;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00c8ff, #0055ff);
            border: none;
            border-radius: 10px;
            color: #001a33;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0, 180, 255, 0.4);
        }
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .links {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #3a5a8a;
        }
        .links a {
            color: #00c8ff;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: #2a0a0a;
            border: 1px solid #ff444444;
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .demo-hint {
            background: #0a1828;
            border: 1px solid #1e4a9a;
            color: #6a9acc;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .demo-hint strong {
            color: #00c8ff;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🤖</div>
        <h1>AquaGarden</h1>
        <p class="subtitle">AI 机械臂智能控制系统</p>

        <div class="demo-hint">
            <strong>演示账号：</strong> admin / admin123
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm" onsubmit="handleLogin(); return false;">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required value="admin">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required value="admin123">
            </div>
            <button type="button" class="btn-login" id="loginBtn" onclick="handleLogin()">登 录</button>
        </form>

        <div class="links">
            还没有账号？<a href="/register.html">立即注册</a>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';

        // 检查是否已登录
        if (localStorage.getItem('ag_access_token')) {
            window.location.replace('/index.html');
            throw new Error('redirecting');
        }

        function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!username || !password) {
                errorMsg.textContent = '请输入用户名和密码';
                errorMsg.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';
            errorMsg.classList.remove('show');

            const req = new XMLHttpRequest();
            req.open('POST', `${API_BASE}/auth/login`, true);
            req.setRequestHeader('Content-Type', 'application/json');
            
            req.onreadystatechange = function() {
                if (req.readyState === 4) {
                    if (req.status === 200) {
                        try {
                            const data = JSON.parse(req.responseText);
                            localStorage.setItem('ag_access_token', data.access_token);
                            localStorage.setItem('ag_refresh_token', data.refresh_token);
                            window.location.href = '/index.html';
                        } catch (e) {
                            errorMsg.textContent = '登录响应解析失败';
                            errorMsg.classList.add('show');
                            btn.disabled = false;
                            btn.textContent = '登 录';
                        }
                    } else {
                        try {
                            const err = JSON.parse(req.responseText);
                            errorMsg.textContent = err.detail || '登录失败';
                        } catch (e) {
                            errorMsg.textContent = '登录失败 (HTTP ' + req.status + ')';
                        }
                        errorMsg.classList.add('show');
                        btn.disabled = false;
                        btn.textContent = '登 录';
                    }
                }
            };
            
            req.send(JSON.stringify({ username, password }));
        }
    </script>
</body>
</html>
