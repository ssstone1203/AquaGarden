<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        

    <title>登录 - AquaGarden</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;


            background: linear-gradient(135deg, #080c18 0%, #0b1428 100%);
            color: #d0dff5;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-grid {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image:
                linear-gradient(rgba(0,100,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,100,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .login-card {
            position: relative; z-index: 1;
            width: 400px; max-width: 90vw;
            background: #0b1228;
            border: 1px solid #1b3060;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .card-header { text-align: center; margin-bottom: 32px; }
        .logo {
            width: 56px; height: 56px; margin: 0 auto 16px;
            background: linear-gradient(135deg, #00c8ff, #005fff);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
        }
        .card-header h1 {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(135deg, #00c8ff, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .card-header p { font-size: 12px; color: #3a5a8a; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 600;
            color: #5a8ac0; margin-bottom: 8px; letter-spacing: 0.5px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap .icon {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%); font-size: 14px; opacity: 0.5;
        }
        .form-group input {
            width: 100%; padding: 11px 14px 11px 38px;
            background: #08101e; border: 1px solid #1a3060;
            border-radius: 10px; color: #c0d8f5; font-size: 14px;
            outline: none; transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: #00c8ff;
            box-shadow: 0 0 0 3px rgba(0,200,255,0.1);
            background: #091828;
        }
        .form-group input::placeholder { color: #2a4060; }
        .btn-login {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #00c8ff, #0055ff);
            color: #001a33; font-size: 14px; font-weight: 700;
            border: none; border-radius: 10px; cursor: pointer;
            transition: all 0.2s; margin-top: 8px;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(0,180,255,0.4);
        }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .card-footer {
            text-align: center; margin-top: 24px;
            font-size: 13px; color: #2a4a6e;
        }
        .card-footer a {
            color: #00c8ff; text-decoration: none; font-weight: 600;
        }
        .card-footer a:hover { text-decoration: underline; }
        .error-msg {
            background: #ff444414; border: 1px solid #ff444444;
            border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
            font-size: 13px; color: #ff6b6b; display: none;
        }
        .loading-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(8,12,24,0.7); z-index: 100;
            align-items: center; justify-content: center;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #1a3060;
            border-top-color: #00c8ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="bg-grid"></div>

<div class="login-card">
    <div class="card-header">
        <div class="logo">🤖</div>
        <h1>AquaGarden</h1>
        <p>机械臂智能控制平台 &nbsp;·&nbsp; 登录</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="username">用户名</label>
            <div class="input-wrap">
                <span class="icon">👤</span>
                <input type="text" id="username" name="username"
                       placeholder="请输入用户名" required autocomplete="username" />
            </div>
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <div class="input-wrap">
                <span class="icon">🔒</span>
                <input type="password" id="password" name="password"
                       placeholder="请输入密码" required autocomplete="current-password" />
            </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">登 录</button>
    </form>

    <div class="card-footer">
        还没有账号？<a href="register.html">立即注册</a>
    </div>
</div>

<!-- 加载遮罩 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<script src="js/api.js"></script>
<script>
    // 如果已登录，直接跳转主页
    if (window.API && window.API.token.isLoggedIn()) {
        window.location.href = 'index.html';
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }

    function hideError() {
        document.getElementById('errorMsg').style.display = 'none';
    }

    function setLoading(loading) {
        document.getElementById('loadingOverlay').classList.toggle('active', loading);
        document.getElementById('loginBtn').disabled = loading;
        document.getElementById('loginBtn').textContent = loading ? '登录中...' : '登 录';
    }

    async function handleLogin(event) {
        event.preventDefault();
        hideError();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
            showError('请填写用户名和密码');
            return;
        }

        setLoading(true);

        try {
            await window.API.auth.login(username, password);
            window.location.href = 'index.html';
        } catch (err) {
            showError(err.message || '登录失败，请检查用户名和密码');
            setLoading(false);
        }
    }
</script>
</body>
</html>
