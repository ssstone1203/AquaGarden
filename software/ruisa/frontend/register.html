<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - AquaGarden</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #080c18 0%, #0b1428 100%);
            color: #d0dff5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: #0b1228;
            border: 1px solid #1b3060;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 40px rgba(0, 100, 200, 0.15);
        }
        .logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #00c8ff, #005fff);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            margin: 0 auto 24px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00c8ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #3a5a8a;
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #5a8ac0;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #142040;
            border: 1px solid #1e3a60;
            border-radius: 10px;
            color: #c0d8f0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #00c8ff;
        }
        input::placeholder {
            color: #3a5a80;
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00c8ff, #0055ff);
            border: none;
            border-radius: 10px;
            color: #001a33;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }
        .btn-register:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0, 180, 255, 0.4);
        }
        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .links {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #3a5a8a;
        }
        .links a {
            color: #00c8ff;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: #2a0a0a;
            border: 1px solid #ff444444;
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .success-msg {
            background: #0a1a0a;
            border: 1px solid #00e87a44;
            color: #00e87a;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .success-msg.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="logo">🤖</div>
        <h1>注册账号</h1>
        <p class="subtitle">创建你的 AquaGarden 账号</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="registerForm" onsubmit="handleRegister(); return false;">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名（3-20字符）" required minlength="3" maxlength="20">
            </div>
            <div class="form-group">
                <label for="email">邮箱（可选）</label>
                <input type="email" id="email" name="email" placeholder="请输入邮箱">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码（至少6字符）" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required>
            </div>
            <button type="button" class="btn-register" id="registerBtn" onclick="handleRegister()">注 册</button>
        </form>

        <div class="links">
            已有账号？<a href="/login.html">立即登录</a>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';

        function handleRegister() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('registerBtn');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.classList.remove('show');

            if (!username || !password) {
                errorMsg.textContent = '请填写所有必填项';
                errorMsg.classList.add('show');
                return;
            }

            if (password !== confirmPassword) {
                errorMsg.textContent = '两次输入的密码不一致';
                errorMsg.classList.add('show');
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = '密码长度至少为6个字符';
                errorMsg.classList.add('show');
                return;
            }

            btn.disabled = true;
            btn.textContent = '注册中...';

            const req = new XMLHttpRequest();
            req.open('POST', `${API_BASE}/auth/register`, true);
            req.setRequestHeader('Content-Type', 'application/json');
            
            req.onreadystatechange = function() {
                if (req.readyState === 4) {
                    if (req.status === 201 || req.status === 200) {
                        window.location.href = '/login.html';
                    } else {
                        try {
                            const err = JSON.parse(req.responseText);
                            errorMsg.textContent = err.detail || '注册失败';
                        } catch (e) {
                            errorMsg.textContent = '注册失败 (HTTP ' + req.status + ')';
                        }
                        errorMsg.classList.add('show');
                        btn.disabled = false;
                        btn.textContent = '注 册';
                    }
                }
            };
            
            const body = { username, password };
            if (email) body.email = email;
            req.send(JSON.stringify(body));
        }
    </script>
</body>
</html>
