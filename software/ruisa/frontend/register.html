<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - AquaGarden 机械臂控制平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #080c18 0%, #0b1428 100%);
            color: #d0dff5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-grid {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background-image:
                linear-gradient(rgba(0,100,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,100,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .register-card {
            position: relative; z-index: 1;
            width: 420px; max-width: 90vw;
            background: #0b1228;
            border: 1px solid #1b3060;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .card-header { text-align: center; margin-bottom: 32px; }
        .logo {
            width: 56px; height: 56px; margin: 0 auto 16px;
            background: linear-gradient(135deg, #00c8ff, #005fff);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
        }
        .card-header h1 {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(135deg, #00c8ff, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .card-header p { font-size: 12px; color: #3a5a8a; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 600;
            color: #5a8ac0; margin-bottom: 8px; letter-spacing: 0.5px;
        }
        .input-wrap { position: relative; }
        .input-wrap .icon {
            position: absolute; left: 12px; top: 50%;
            transform: translateY(-50%); font-size: 14px; opacity: 0.5;
        }
        .form-group input {
            width: 100%; padding: 11px 14px 11px 38px;
            background: #08101e; border: 1px solid #1a3060;
            border-radius: 10px; color: #c0d8f5; font-size: 14px;
            outline: none; transition: all 0.2s;
        }
        .form-group input:focus {
            border-color: #00c8ff;
            box-shadow: 0 0 0 3px rgba(0,200,255,0.1);
            background: #091828;
        }
        .form-group input::placeholder { color: #2a4060; }
        .form-hint {
            font-size: 11px; color: #2a4060; margin-top: 6px;
        }
        .btn-register {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #00c8ff, #0055ff);
            color: #001a33; font-size: 14px; font-weight: 700;
            border: none; border-radius: 10px; cursor: pointer;
            transition: all 0.2s; margin-top: 8px;
        }
        .btn-register:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(0,180,255,0.4);
        }
        .btn-register:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .card-footer {
            text-align: center; margin-top: 24px;
            font-size: 13px; color: #2a4a6e;
        }
        .card-footer a { color: #00c8ff; text-decoration: none; font-weight: 600; }
        .card-footer a:hover { text-decoration: underline; }
        .error-msg {
            background: #ff444414; border: 1px solid #ff444444;
            border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
            font-size: 13px; color: #ff6b6b; display: none;
        }
        .success-msg {
            background: #00e87a14; border: 1px solid #00e87a44;
            border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
            font-size: 13px; color: #00e87a; display: none;
        }
        .loading-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(8,12,24,0.7); z-index: 100;
            align-items: center; justify-content: center;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #1a3060;
            border-top-color: #00c8ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="bg-grid"></div>

<div class="register-card">
    <div class="card-header">
        <div class="logo">🤖</div>
        <h1>AquaGarden</h1>
        <p>机械臂智能控制平台 &nbsp;·&nbsp; 创建账号</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
            <label for="username">用户名</label>
            <div class="input-wrap">
                <span class="icon">👤</span>
                <input type="text" id="username" name="username"
                       placeholder="3-50位字母、数字、下划线" required
                       minlength="3" maxlength="50"
                       pattern="[a-zA-Z0-9_-]+"
                       autocomplete="username" />
            </div>
            <div class="form-hint">字母、数字、下划线或连字符，3-50个字符</div>
        </div>

        <div class="form-group">
            <label for="email">邮箱 <span style="font-weight:400;color:#2a4a6e">(可选)</span></label>
            <div class="input-wrap">
                <span class="icon">✉️</span>
                <input type="email" id="email" name="email"
                       placeholder="example@example.com"
                       autocomplete="email" />
            </div>
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <div class="input-wrap">
                <span class="icon">🔒</span>
                <input type="password" id="password" name="password"
                       placeholder="至少 6 个字符" required minlength="6"
                       autocomplete="new-password" />
            </div>
            <div class="form-hint">至少 6 个字符，建议包含字母和数字</div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">确认密码</label>
            <div class="input-wrap">
                <span class="icon">🔒</span>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="再次输入密码" required minlength="6"
                       autocomplete="new-password" />
            </div>
        </div>

        <button type="submit" class="btn-register" id="registerBtn">创建账号</button>
    </form>

    <div class="card-footer">
        已有账号？<a href="login.html">立即登录</a>
    </div>
</div>

<!-- 加载遮罩 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<script src="js/api.js"></script>
<script>
    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
        document.getElementById('successMsg').style.display = 'none';
    }

    function showSuccess(msg) {
        const el = document.getElementById('successMsg');
        el.textContent = msg;
        el.style.display = 'block';
        document.getElementById('errorMsg').style.display = 'none';
    }

    function hideMessages() {
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('successMsg').style.display = 'none';
    }

    function setLoading(loading) {
        document.getElementById('loadingOverlay').classList.toggle('active', loading);
        document.getElementById('registerBtn').disabled = loading;
        document.getElementById('registerBtn').textContent = loading ? '注册中...' : '创建账号';
    }

    async function handleRegister(event) {
        event.preventDefault();
        hideMessages();

        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!username) {
            showError('请填写用户名');
            return;
        }

        if (password !== confirmPassword) {
            showError('两次输入的密码不一致');
            return;
        }

        if (password.length < 6) {
            showError('密码长度至少为 6 个字符');
            return;
        }

        setLoading(true);

        try {
            await window.API.auth.register(username, password, email || null);
            showSuccess('注册成功！正在跳转登录页面...');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        } catch (err) {
            showError(err.message || '注册失败，请稍后重试');
            setLoading(false);
        }
    }
</script>
</body>
</html>
