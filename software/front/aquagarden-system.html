<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaGarden - 智能水族箱监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* 侧边栏样式 */
        .sidebar {
            width: 216px;
            background: linear-gradient(180deg, #2d2d4a 0%, #1a1a2e 100%);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            padding: 0 20px 30px;
            color: white;
            font-size: 20px;
            font-weight: 600;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nav-menu {
            flex: 1;
        }

        .nav-item {
            padding: 12px 20px;
            margin: 4px 12px;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            font-size: 14px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .nav-icon {
            margin-right: 12px;
            font-size: 18px;
        }

        .user-info {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            color: white;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-name {
            flex: 1;
            font-size: 14px;
        }

        .user-role {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* 主内容区域 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            background: #f5f7fa;
        }

        .header {
            background: white;
            padding: 20px 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .header-subtitle {
            font-size: 14px;
            color: #8b92a7;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .view-toggle {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            padding: 8px 16px;
            border: 1px solid #e5e7eb;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #6b7280;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .time-display {
            font-size: 14px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-area {
            padding: 30px 40px;
        }

        /* 仪表板样式 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border-left: 4px solid;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .stat-card.temperature { border-left-color: #ef4444; }
        .stat-card.ph { border-left-color: #3b82f6; }
        .stat-card.oxygen { border-left-color: #10b981; }
        .stat-card.turbidity { border-left-color: #f59e0b; }

        .stat-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin-right: 16px;
        }

        .stat-card.temperature .stat-icon { background: #ef4444; }
        .stat-card.ph .stat-icon { background: #3b82f6; }
        .stat-card.oxygen .stat-icon { background: #10b981; }
        .stat-card.turbidity .stat-icon { background: #f59e0b; }

        .stat-info h3 {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .stat-unit {
            font-size: 16px;
            color: #9ca3af;
            margin-left: 4px;
        }

        .stat-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 12px;
        }

        .stat-status.normal {
            background: #d1fae5;
            color: #065f46;
        }

        .stat-status.good {
            background: #dbeafe;
            color: #1e40af;
        }

        .stat-status.high {
            background: #fef3c7;
            color: #92400e;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .dashboard-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.online {
            background: #d1fae5;
            color: #065f46;
        }

        /* 视频监控样式 */
        .video-container {
            background: #000;
            border-radius: 12px;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .video-placeholder {
            color: #6b7280;
            font-size: 14px;
        }

        .rec-indicator {
            position: absolute;
            top: 16px;
            left: 16px;
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rec-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .video-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #f3f4f6;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: #667eea;
            color: white;
        }

        .position-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #6b7280;
            font-size: 14px;
            margin-top: 12px;
        }

        /* 数据趋势图 */
        .chart-container {
            height: 200px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 20px 0;
        }

        .chart-bar {
            flex: 1;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px 4px 0 0;
            min-height: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .chart-bar:hover {
            opacity: 0.8;
        }

        /* 实时数据列表 */
        .data-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .data-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: #f9fafb;
            border-radius: 12px;
        }

        .data-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .data-item-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .data-item-info h4 {
            font-size: 14px;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .data-item-time {
            font-size: 12px;
            color: #9ca3af;
        }

        .data-item-value {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
        }

        /* 系统日志 */
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-item {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 3px solid;
        }

        .log-item.system { border-left-color: #667eea; }
        .log-item.warning { border-left-color: #f59e0b; }
        .log-item.error { border-left-color: #ef4444; }

        .log-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .log-badge.system {
            background: #e0e7ff;
            color: #4338ca;
        }

        .log-badge.warning {
            background: #fef3c7;
            color: #92400e;
        }

        .log-content {
            flex: 1;
            font-size: 14px;
            color: #1a1a2e;
        }

        /* 历史数据页面 */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-item label {
            font-size: 13px;
            color: #6b7280;
        }

        .filter-input {
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
        }

        .filter-btn {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            align-self: flex-end;
        }

        .filter-btn:hover {
            background: #5568d3;
        }

        .data-table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .data-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th {
            background: #f9fafb;
            padding: 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            border-bottom: 1px solid #e5e7eb;
        }

        .data-table td {
            padding: 16px;
            font-size: 14px;
            color: #1a1a2e;
            border-bottom: 1px solid #f3f4f6;
        }

        .data-table tr:hover {
            background: #f9fafb;
        }

        /* 机械臂控制页面 */
        .control-panel {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .joystick-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .joystick {
            width: 240px;
            height: 240px;
            background: #f9fafb;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e5e7eb;
        }

        .joystick-handle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            cursor: move;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .preset-btn {
            padding: 12px 20px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .status-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .status-item {
            padding: 16px;
            background: #f9fafb;
            border-radius: 12px;
        }

        .status-item h4 {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .status-value {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
        }

        /* 警报设置页面 */
        .alert-settings {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setting-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .setting-card h3 {
            font-size: 16px;
            color: #1a1a2e;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .range-inputs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 13px;
            color: #6b7280;
        }

        .input-group input {
            padding: 10px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
        }

        .switch {
            position: relative;
            width: 48px;
            height: 24px;
            background: #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .switch.active {
            background: #10b981;
        }

        .switch::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }

        .switch.active::after {
            transform: translateX(24px);
        }

        .save-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            align-self: flex-start;
        }

        .save-btn:hover {
            background: #5568d3;
        }

        /* 系统设置页面 */
        .settings-grid {
            display: grid;
            gap: 20px;
        }

        .setting-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .setting-section h3 {
            font-size: 16px;
            color: #1a1a2e;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f3f4f6;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .setting-row:last-child {
            border-bottom: none;
        }

        .setting-label {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .setting-label h4 {
            font-size: 14px;
            color: #1a1a2e;
        }

        .setting-label p {
            font-size: 13px;
            color: #9ca3af;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .control-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 72px;
            }

            .logo span,
            .nav-item span,
            .user-info .user-name,
            .user-info .user-role {
                display: none;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">🐠</div>
                <span>AquaGarden</span>
            </div>

            <div class="nav-menu">
                <div class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">📊</span>
                    <span>仪表板</span>
                </div>
                <div class="nav-item" data-page="video">
                    <span class="nav-icon">📹</span>
                    <span>视频监控</span>
                </div>
                <div class="nav-item" data-page="history">
                    <span class="nav-icon">📈</span>
                    <span>历史数据</span>
                </div>
                <div class="nav-item" data-page="robot">
                    <span class="nav-icon">🤖</span>
                    <span>机械臂控制</span>
                </div>
                <div class="nav-item" data-page="alerts">
                    <span class="nav-icon">🔔</span>
                    <span>警报设置</span>
                </div>
                <div class="nav-item" data-page="settings">
                    <span class="nav-icon">⚙️</span>
                    <span>系统设置</span>
                </div>
            </div>

            <div class="user-info">
                <div class="user-avatar">👤</div>
                <div style="flex: 1;">
                    <div class="user-name">管理员</div>
                    <div class="user-role">Admin</div>
                </div>
                <span style="cursor: pointer;">⚡</span>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content">
            <div class="header">
                <div class="header-title">
                    <h1 id="pageTitle">控制面板</h1>
                    <div class="header-subtitle" id="pageSubtitle">实时监控您的水族箱状态</div>
                </div>
                <div class="header-actions">
                    <div class="view-toggle">
                        <button class="toggle-btn active">💧 演示模式</button>
                        <button class="toggle-btn">⭐ 服务模式</button>
                    </div>
                    <div class="time-display">
                        <span>🕐</span>
                        <span id="currentTime">15:13:50</span>
                    </div>
                </div>
            </div>

            <div class="content-area" id="contentArea">
                <!-- 内容将通过JavaScript动态加载 -->
            </div>
        </div>
    </div>

    <script>
        // 更新时间
        function updateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
            document.getElementById('currentTime').textContent = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 生成模拟数据
        function generateHistoricalData() {
            const data = [];
            const now = Date.now();
            for (let i = 0; i < 100; i++) {
                data.push({
                    time: new Date(now - i * 3600000).toLocaleString('zh-CN'),
                    temperature: (25 + Math.random() * 2).toFixed(1),
                    ph: (6.8 + Math.random() * 0.4).toFixed(1),
                    oxygen: (8.2 + Math.random() * 0.8).toFixed(1),
                    turbidity: (12 + Math.random() * 3).toFixed(0)
                });
            }
            return data;
        }

        // 页面内容模板
        const pageTemplates = {
            dashboard: `
                <div class="stats-grid">
                    <div class="stat-card temperature">
                        <div class="stat-header">
                            <div class="stat-icon">🌡️</div>
                            <div class="stat-info">
                                <h3>水温</h3>
                            </div>
                        </div>
                        <div>
                            <span class="stat-value">26</span>
                            <span class="stat-unit">°C</span>
                        </div>
                        <div class="stat-status normal">
                            <span>●</span>
                            <span>正常范围</span>
                        </div>
                    </div>

                    <div class="stat-card ph">
                        <div class="stat-header">
                            <div class="stat-icon">⚗️</div>
                            <div class="stat-info">

        // 页面切换函数
        function switchPage(pageName) {
            // 更新导航菜单
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.page === pageName) {
                    item.classList.add('active');
                }
            });

            // 更新页面标题
            const config = pageConfig[pageName];
            document.getElementById('pageTitle').textContent = config.title;
            document.getElementById('pageSubtitle').textContent = config.subtitle;

            // 更新内容区域
            document.getElementById('contentArea').innerHTML = pageTemplates[pageName];
        }

        // 绑定导航点击事件
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const pageName = item.dataset.page;
                switchPage(pageName);
            });
        });

        // 切换开关函数
        function toggleSwitch(element) {
            element.classList.toggle('active');
        }

        // 机械臂控制函数

                'up-right': 'X+ Y+',
                'down-left': 'X- Y-',
                'down-right': 'X+ Y-',

            };
            alert(`机械臂移动: ${directionMap[direction]}`);
        }
