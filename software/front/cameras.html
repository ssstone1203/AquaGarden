<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaGarden - 视频监控</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .video-page {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 24px;
        }

        .video-card {
            background: var(--bg-card);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--bg-main);
        }

        .video-header h3 {
            font-size: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .video-header h3 i {
            color: var(--primary-color);
        }

        .video-actions {
            display: flex;
            gap: 8px;
        }

        .video-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--bg-main);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .video-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.4) 100%);
        }

        .video-info-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .rec-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .rec-indicator .rec-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .camera-name {
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border-radius: 6px;
            font-size: 12px;
        }

        .video-info-bottom {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .video-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border-radius: 6px;
            font-size: 12px;
        }

        .video-controls-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: var(--bg-main);
        }

        .control-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            background: var(--bg-card);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .control-btn.record {
            background: #ef4444;
            color: white;
        }

        .control-btn.record:hover {
            background: #dc2626;
        }

        .recording-section {
            background: var(--bg-card);
            border-radius: var(--border-radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-md);
        }

        .recording-section h3 {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .recording-section h3 i {
            color: var(--primary-color);
        }

        .recording-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .recording-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: var(--bg-main);
            border-radius: 10px;
        }

        .recording-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .recording-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            border-radius: 10px;
            color: white;
            font-size: 20px;
        }

        .recording-details h4 {
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .recording-details p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .recording-actions {
            display: flex;
            gap: 8px;
        }

        .action-icon-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .action-icon-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .action-icon-btn.danger:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>
    <!-- 左侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-fish"></i>
                <span>AquaGarden</span>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-tachometer-alt"></i>
                <span>仪表板</span>
            </a>
            <a href="cameras.html" class="nav-item active">
                <i class="fas fa-video"></i>
                <span>视频监控</span>
            </a>
            <a href="history.html" class="nav-item">
                <i class="fas fa-chart-line"></i>
                <span>历史数据</span>
            </a>
            <a href="robot.html" class="nav-item">
                <i class="fas fa-robot"></i>
                <span>机械臂控制</span>
            </a>
            <a href="alerts.html" class="nav-item">
                <i class="fas fa-bell"></i>
                <span>警报设置</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>系统设置</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <div class="user-details">
                    <div class="user-name">管理员</div>
                    <div class="user-role">Admin</div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </aside>
    
    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 顶部栏 -->
        <header class="top-header">
            <div class="header-left">
                <h1>视频监控</h1>
                <p class="subtitle">实时查看水族箱内部情况</p>
            </div>
            <div class="header-right">
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="demo">
                        <i class="fas fa-eye"></i>
                        演示模式
                    </button>
                    <button class="mode-btn" data-mode="service">
                        <i class="fas fa-tools"></i>
                        服务模式
                    </button>
                </div>
                <div class="time-display">
                    <i class="fas fa-clock"></i>
                    <span id="timeText">--:--:--</span>
                </div>
            </div>
        </header>

        <!-- 视频监控内容 -->
        <div class="video-page">
            <!-- 视频网格 -->
            <div class="video-grid">
                <!-- 机械臂摄像头 -->
                <div class="video-card">
                    <div class="video-header">
                        <h3><i class="fas fa-robot"></i> 机械臂摄像头</h3>
                        <div class="video-actions">
                            <button class="video-btn" title="全屏" onclick="toggleFullscreen('robot')">
                                <i class="fas fa-expand"></i>
                            </button>
                            <button class="video-btn" title="截图" onclick="takeScreenshot('robot')">
                                <i class="fas fa-camera"></i>
                            </button>
                        </div>
                    </div>
                    <div class="video-container" id="robotVideo">
                        <img id="robotCameraImg" src="" alt="机械臂摄像头">
                        <div class="video-overlay">
                            <div class="video-info-top">
                                <div class="rec-indicator">
                                    <div class="rec-dot"></div>
                                    REC
                                </div>
                                <div class="camera-name">CAM-01</div>
                            </div>
                            <div class="video-info-bottom">
                                <div class="video-stat">
                                    <i class="fas fa-expand"></i>
                                    1920x1080
                                </div>
                                <div class="video-stat">
                                    <i name="fas fa-tachometer-alt"></i>
                                    30 FPS
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="video-controls-bar">
                        <button class="control-btn" onclick="toggleRecording('robot')" id="robotRecordBtn">
                            <i class="fas fa-record-vinyl"></i>
                            录制
                        </button>
                        <button class="control-btn" onclick="takeScreenshot('robot')">
                            <i class="fas fa-camera"></i>
                            截图
                        </button>
                        <button class="control-btn" onclick="stopRecording('robot')">
                            <i class="fas fa-stop"></i>
                            停止
                        </button>
                    </div>
                </div>

                <!-- 鱼缸摄像头 -->
                <div class="video-card">
                    <div class="video-header">
                        <h3><i class="fas fa-water"></i> 鱼缸摄像头</h3>
                        <div class="video-actions">
                            <button class="video-btn" title="全屏" onclick="toggleFullscreen('tank')">
                                <i class="fas fa-expand"></i>
                            </button>
                            <button class="video-btn" title="截图" onclick="takeScreenshot('tank')">
                                <i class="fas fa-camera"></i>
                            </button>
                        </div>
                    </div>
                    <div class="video-container" id="tankVideo">
                        <img id="tankCameraImg" src="" alt="鱼缸摄像头">
                        <div class="video-overlay">
                            <div class="video-info-top">
                                <div class="rec-indicator">
                                    <div class="rec-dot"></div>
                                    REC
                                </div>
                                <div class="camera-name">CAM-02</div>
                            </div>
                            <div class="video-info-bottom">
                                <div class="video-stat">
                                    <i class="fas fa-expand"></i>
                                    1920x1080
                                </div>
                                <div class="video-stat">
                                    <i class="fas fa-tachometer-alt"></i>
                                    30 FPS
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="video-controls-bar">
                        <button class="control-btn" onclick="toggleRecording('tank')" id="tankRecordBtn">
                            <i class="fas fa-record-vinyl"></i>
                            录制
                        </button>
                        <button class="control-btn" onclick="takeScreenshot('tank')">
                            <i class="fas fa-camera"></i>
                            截图
                        </button>
                        <button class="control-btn" onclick="stopRecording('tank')">
                            <i class="fas fa-stop"></i>
                            停止
                        </button>
                    </div>
                </div>
            </div>

            <!-- 录像列表 -->
            <div class="recording-section">
                <h3><i class="fas fa-film"></i> 录像列表</h3>
                <div class="recording-list">
                    <div class="recording-item">
                        <div class="recording-info">
                            <div class="recording-icon">
                                <i class="fas fa-video"></i>
                            </div>
                            <div class="recording-details">
                                <h4>robot_camera_20250316_143000.mp4</h4>
                                <p>机械臂摄像头 • 10分钟 • 128MB</p>
                            </div>
                        </div>
                        <div class="recording-actions">
                            <button class="action-icon-btn" title="播放">
                                <i class="fas fa-play"></i>
                            </button>
                            <button class="action-icon-btn" title="下载">
                                <i class="fas fa-download"></i>
                            </button>
                            <button class="action-icon-btn danger" title="删除">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="recording-item">
                        <div class="recording-info">
                            <div class="recording-icon">
                                <i class="fas fa-video"></i>
                            </div>
                            <div class="recording-details">
                                <h4>tank_camera_20250316_140000.mp4</h4>
                                <p>鱼缸摄像头 • 10分钟 • 135MB</p>
                            </div>
                        </div>
                        <div class="recording-actions">
                            <button class="action-icon-btn" title="播放">
                                <i class="fas fa-play"></i>
                            </button>
                            <button class="action-icon-btn" title="下载">
                                <i class="fas fa-download"></i>
                            </button>
                            <button class="action-icon-btn danger" title="删除">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // API配置
        const API_BASE_URL = 'http://localhost:8000';
        let authToken = localStorage.getItem('token');

        // 时间更新
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            });
            const timeElement = document.getElementById('timeText');
            if (timeElement) {
                timeElement.textContent = timeString;
            }
        }

        setInterval(updateTime, 1000);
        updateTime();

        // 视频流更新
        function updateVideoFeeds() {
            const robotImg = document.getElementById('robotCameraImg');
            const tankImg = document.getElementById('tankCameraImg');
            
            if (robotImg) {
                robotImg.src = `${API_BASE_URL}/api/video/robot?t=${Date.now()}`;
            }
            if (tankImg) {
                tankImg.src = `${API_BASE_URL}/api/video/tank?t=${Date.now()}`;
            }
        }

        // 设置定时刷新视频流
        setInterval(updateVideoFeeds, 100);
        updateVideoFeeds();

        // 全屏切换
        function toggleFullscreen(camera) {
            const videoContainer = document.getElementById(`${camera}Video`);
            if (videoContainer) {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    videoContainer.requestFullscreen();
                }
            }
        }

        // 截图功能
        function takeScreenshot(camera) {
            alert(`${camera === 'robot' ? '机械臂' : '鱼缸'}摄像头截图已保存`);
        }

        // 录制功能
        function toggleRecording(camera) {
            const btn = document.getElementById(`${camera}RecordBtn`);
            if (btn) {
                btn.classList.toggle('record');
                const isRecording = btn.classList.contains('record');
                btn.innerHTML = isRecording 
                    ? '<i class="fas fa-stop"></i> 停止' 
                    : '<i class="fas fa-record-vinyl"></i> 录制';
            }
        }

        function stopRecording(camera) {
            const btn = document.getElementById(`${camera}RecordBtn`);
            if (btn) {
                btn.classList.remove('record');
                btn.innerHTML = '<i class="fas fa-record-vinyl"></i> 录制';
            }
        }

        // 登出功能
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                if (confirm('确定要退出系统吗？')) {
                    localStorage.removeItem('token');
                    window.location.href = 'login.html';
                }
            });
        }

        // 模式切换
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>
</body>
</html>
